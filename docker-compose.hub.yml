# اجرای کامل سامانه KPI با تصاویر آماده از Docker Hub
# نیازی به سورس‌کد نیست — فقط این فایل کافی است.
#
#   docker compose -f docker-compose.hub.yml up -d
#
# فرانت‌اند:  http://localhost:3000
# بک‌اند API: http://localhost:8000/docs

services:
  backend:
    image: meysam8498/hr-kpi-platform:backend-latest
    # برای نسخه مشخص: meysam8498/hr-kpi-platform:backend-v1.2.0
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_DIR=/app/data
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: meysam8498/hr-kpi-platform:frontend-latest
    # برای نسخه مشخص: meysam8498/hr-kpi-platform:frontend-v1.2.0
    ports:
      - "3000:3000"
    environment:
      - API_UPSTREAM=http://backend:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  db-data:
    driver: local
